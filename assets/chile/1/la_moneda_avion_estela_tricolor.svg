   <path d="M-420 58 Q-230 48 -15 52" stroke="url(#smokeB)" stroke-width="15" stroke-dasharray="440" stroke-dashoffset="440"><animate attributeName="stroke-dashoffset" values="440;0;0" keyTimes="0;.4;1" dur="7s" repeatCount="indefinite"/></path>
