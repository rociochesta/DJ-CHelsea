 <linearGradient id="smokeW"><stop stop-color="#fff7ee" stop-opacity="0"/><stop offset=".25" stop-color="#fff7ee" stop-opacity=".65"/><stop offset="1" stop-color="#ffffff" stop-opacity=".96"/></linearGradient>
