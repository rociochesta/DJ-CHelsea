<!-- Airplane flies from left to right across the open sky below the title. -->
<g>
 <animateTransform attributeName="transform" type="translate" values="-200 645; -200 645; 1110 540; 1110 540" keyTimes="0;.08;.78;1" dur="7s" repeatCount="indefinite"/>
 <g opacity="0">
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.7;1" dur="7s" repeatCount="indefinite"/>
