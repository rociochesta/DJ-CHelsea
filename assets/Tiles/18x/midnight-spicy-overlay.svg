<svg xmlns="http://www.w3.org/2000/svg" width="949" height="1657" viewBox="0 0 949 1657" fill="none"><title>Midnight Spicy typing and flame glow</title><desc>Transparent full-tile overlay. Typing dots brighten in sequence and the two existing flames glow softly. Plays once over two seconds. Align with the entire original tile; remount to replay.</desc><style>@media(prefers-reduced-motion:reduce){.effect{display:none}}</style><defs><radialGradient id="midnight-warm-glow"><stop stop-color="#fff1a0" stop-opacity=".34"/><stop offset=".45" stop-color="#ffac3f" stop-opacity=".2"/><stop offset="1" stop-color="#ff7b20" stop-opacity="0"/></radialGradient></defs><circle class="effect" cx="467" cy="1288" r="12" fill="#fff9dc" opacity="0"><animate attributeName="opacity" values="0;.95;.1;.95;0" keyTimes="0;.15;.4;.7;1" dur="1.6s" begin="0.00s" fill="freeze"/></circle><circle class="effect" cx="513" cy="1280" r="12" fill="#fff9dc" opacity="0"><animate attributeName="opacity" values="0;.95;.1;.95;0" keyTimes="0;.15;.4;.7;1" dur="1.6s" begin="0.15s" fill="freeze"/></circle><circle class="effect" cx="560" cy="1273" r="12" fill="#fff9dc" opacity="0"><animate attributeName="opacity" values="0;.95;.1;.95;0" keyTimes="0;.15;.4;.7;1" dur="1.6s" begin="0.30s" fill="freeze"/></circle><g transform="translate(771 639)"><g class="effect" opacity="0"><ellipse rx="52" ry="66" fill="url(#midnight-warm-glow)"/><animate attributeName="opacity" values="0;.8;.4;.75;.3;.65;0" dur="1.85s" begin="0.0s" fill="freeze"/><animateTransform attributeName="transform" type="scale" values=".95;1.06;.98;1.04;1" dur="1.85s" begin="0.0s" fill="freeze"/></g></g><g transform="translate(604 1074)"><g class="effect" opacity="0"><ellipse rx="57" ry="65" fill="url(#midnight-warm-glow)"/><animate attributeName="opacity" values="0;.8;.4;.75;.3;.65;0" dur="1.85s" begin="0.15s" fill="freeze"/><animateTransform attributeName="transform" type="scale" values=".95;1.06;.98;1.04;1" dur="1.85s" begin="0.15s" fill="freeze"/></g></g></svg>