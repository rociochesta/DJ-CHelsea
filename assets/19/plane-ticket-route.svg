<svg xmlns="http://www.w3.org/2000/svg" width="949" height="1657" viewBox="0 0 949 1657" fill="none"><title>Plane Ticket takeoff overlay</title><style>.plane{animation:ticket-takeoff 1.5s ease-out both}.route{animation:ticket-route 1.5s ease-out both}@keyframes ticket-takeoff{0%{transform:translate(-84px,110px);opacity:0}12%{opacity:1}100%{transform:translate(0,0);opacity:1}}@keyframes ticket-route{0%{stroke-dashoffset:390;opacity:0}10%{opacity:1}100%{stroke-dashoffset:0;opacity:1}}@media(prefers-reduced-motion:reduce){.plane,.route{animation:none}}</style><defs><mask id="ticket-route-reveal"><path class="route" d="M617 898C714 907 792 850 817 782" stroke="white" stroke-width="15" stroke-dasharray="390" stroke-dashoffset="0" fill="none"/></mask></defs><path d="M617 898C714 907 792 850 817 782" stroke="#111111" stroke-width="10" stroke-dasharray="27 26" stroke-linecap="round" mask="url(#ticket-route-reveal)"/></svg>