<svg xmlns="http://www.w3.org/2000/svg" width="949" height="1657" viewBox="0 0 949 1657" fill="none">
<title>Cerro San Cristóbal — birds landing overlay</title>
<desc>Transparent full-tile overlay. Align edge to edge with the Cerro tile. Two birds cross the sky once in two seconds. Reinsert the SVG to replay.</desc>
<defs><clipPath id="tile-sky"><rect x="36" y="650" width="878" height="148"/></clipPath></defs>
<style>@media (prefers-reduced-motion:reduce){.birds{display:none}}</style>
<g class="birds" clip-path="url(#tile-sky)" stroke="#171716" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
<g>
<animateTransform attributeName="transform" type="translate" values="-40 727;990 697" begin="0s" dur="2s" fill="freeze"/>
<path d="M-14 -5 Q-7 -10 0 0 Q7 -10 14 -5">
<animate attributeName="d" values="M-14 -5 Q-7 -10 0 0 Q7 -10 14 -5;M-14 5 Q-7 3 0 0 Q7 3 14 5;M-14 -5 Q-7 -10 0 0 Q7 -10 14 -5" dur="0.36s" repeatCount="6"/>
</path></g>
<g>
<animateTransform attributeName="transform" type="translate" values="-100 752;970 729" begin="0s" dur="2.2s" fill="freeze"/>
<path d="M-11 -4 Q-5 -8 0 0 Q5 -8 11 -4" stroke-width="3.5">
<animate attributeName="d" values="M-11 4 Q-5 2 0 0 Q5 2 11 4;M-11 -4 Q-5 -8 0 0 Q5 -8 11 -4;M-11 4 Q-5 2 0 0 Q5 2 11 4" dur="0.4s" repeatCount="6"/>
</path></g>
</g></svg>
