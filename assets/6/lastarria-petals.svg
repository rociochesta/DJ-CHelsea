<svg xmlns="http://www.w3.org/2000/svg" width="949" height="1657" viewBox="0 0 949 1657" fill="none">
<title>Barrio Lastarria drifting petals</title>
<desc>Transparent full-tile overlay. Three petals fall from the left flowers and fade out. Plays once; remount to replay.</desc>
<style>@media(prefers-reduced-motion:reduce){.petal{display:none}}</style>
<defs><clipPath id="lastarria-interior"><path d="M38 480H912V1618H38Z"/></clipPath></defs>
<g clip-path="url(#lastarria-interior)">
<g class="petal" opacity="0">
<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.65;1" dur="1.7s" begin="0s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" values="190 700;220 770;205 845;245 930" keyTimes="0;0.33;0.66;1" dur="1.7s" begin="0s" fill="freeze"/>
<g><animateTransform attributeName="transform" type="rotate" values="-25;20;-10;45" dur="1.7s" begin="0s" fill="freeze"/>
<path d="M-9 -3C-12 -13 0 -15 10 -5C12 3 4 12-2 12C-2 5-7 4-9-3Z" fill="#ed287d" stroke="#a91c58" stroke-width="1.6" stroke-linejoin="round"/>
<path d="M-5 -7Q-1 -8 3 -5" stroke="#ff86af" stroke-width="2" stroke-linecap="round"/></g></g>
<g class="petal" opacity="0">
<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.65;1" dur="1.65s" begin="0.18s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" values="265 785;295 850;278 925;315 1010" dur="1.65s" begin="0.18s" fill="freeze"/>
<g><animateTransform attributeName="transform" type="rotate" values="25;-20;15;65" dur="1.65s" begin="0.18s" fill="freeze"/>
<path d="M-8 -3C-10 -12 1 -13 9 -5C12 1 4 10-1 11C-2 4-6 3-8-3Z" fill="#f44a93" stroke="#ad225d" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M-4 -7L1 -5" stroke="#ff9bc0" stroke-width="2" stroke-linecap="round"/></g></g>
<g class="petal" opacity="0">
<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.65;1" dur="1.6s" begin="0.4s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" values="155 865;180 925;165 995;205 1085" dur="1.6s" begin="0.4s" fill="freeze"/>
<g><animateTransform attributeName="transform" type="rotate" values="-10;30;0;70" dur="1.6s" begin="0.4s" fill="freeze"/>
<path d="M-7 -3C-11 -11 0 -13 8 -5C11 2 4 10-1 10C-2 4-5 3-7-3Z" fill="#d91e71" stroke="#a91c58" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M-4 -7L0 -5" stroke="#ff80ae" stroke-width="2" stroke-linecap="round"/></g></g>
</g></svg>
