<svg xmlns="http://www.w3.org/2000/svg" width="949" height="1657" viewBox="0 0 949 1657" fill="none"><title>Grey Snow Eagle House chimney wisps</title><desc>Transparent full-tile overlay. Two soft wisps drift upward from the chimney and fade once over 2.2 seconds. Align edge to edge with the original tile. Remount to replay.</desc><style>@media(prefers-reduced-motion:reduce){.smoke{display:none}}</style><g transform="translate(386 733)"><g class="smoke" opacity="0"><path d="M0 0C-16-13 17-22 4-39C-7-51-14-52-4-69" stroke="#ffe7cf" stroke-width="10" stroke-linecap="round" opacity=".26"/><path d="M0 0C-16-13 17-22 4-39C-7-51-14-52-4-69" stroke="#fff3e2" stroke-width="4" stroke-linecap="round" opacity=".46"/><animateTransform attributeName="transform" type="translate" values="0 0;8 -30;20 -80" dur="1.85s" begin="0s" fill="freeze"/><animate attributeName="opacity" values="0;.72;.4;0" keyTimes="0;.2;.55;1" dur="1.85s" begin="0s" fill="freeze"/></g></g><g transform="translate(395 733)"><g class="smoke" opacity="0"><path d="M0 0C-16-13 17-22 4-39C-7-51-14-52-4-69" stroke="#ffe7cf" stroke-width="10" stroke-linecap="round" opacity=".26"/><path d="M0 0C-16-13 17-22 4-39C-7-51-14-52-4-69" stroke="#fff3e2" stroke-width="4" stroke-linecap="round" opacity=".46"/><animateTransform attributeName="transform" type="translate" values="0 0;8 -30;20 -80" dur="1.85s" begin="0.35s" fill="freeze"/><animate attributeName="opacity" values="0;.72;.4;0" keyTimes="0;.2;.55;1" dur="1.85s" begin="0.35s" fill="freeze"/></g></g></svg>