<svg xmlns="http://www.w3.org/2000/svg" width="950" height="1656" viewBox="0 0 950 1656"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 949 1657" id="layer-b2d26796-8771-48af-bfd5-93b562a648e2" preserveAspectRatio="none" opacity="0"><title>Sushi chopsticks pickup</title><desc>Transparent overlay for the cleaned Sushi tile. Chopsticks enter, grasp the rear maki, lift it gently and return it, then withdraw. Plays once in 1.5 seconds; remount to replay.</desc><style>#layer-b2d26796-8771-48af-bfd5-93b562a648e2 #layer-b2d26796-8771-48af-bfd5-93b562a648e2-sushi-roll { animation: 1.5s ease 0s infinite normal both running layer-b2d26796-8771-48af-bfd5-93b562a648e2_0_sushi-lift; }
