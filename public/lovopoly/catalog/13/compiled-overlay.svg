@keyframes sushi-lift { 
  0%, 33% { transform: translate(0px, 0px); }
  53%, 65% { transform: translate(0px, -65px); }
  84%, 100% { transform: translate(0px, 0px); }
}
@keyframes sushi-sticks { 
  0% { opacity: 0; transform: translate(220px, -100px); }
  12% { opacity: 1; }
  30%, 33% { opacity: 1; transform: translate(0px, 0px); }
  53%, 65% { opacity: 1; transform: translate(0px, -65px); }
  84% { opacity: 1; transform: translate(0px, 0px); }
  100% { opacity: 0; transform: translate(220px, -100px); }
}
@media (prefers-reduced-motion: reduce) {
