<title>Words With You heart tile placement</title>
<desc>Transparent full-tile overlay for the cleaned Words With You tile. Heart tile drops into the empty square beside YOU, bounces once, and remains. Remount to replay.</desc>
<style>#layer-26b9dd8d-816e-44f4-916d-5fb3a28c7784 .heart-tile { animation: 2s ease 0s infinite normal both running layer-26b9dd8d-816e-44f4-916d-5fb3a28c7784_0_words-heart-drop; transform-origin: 690px 1208px; }
#layer-26b9dd8d-816e-44f4-916d-5fb3a28c7784 .tile-shadow { animation: 2s ease 0s infinite normal both running layer-26b9dd8d-816e-44f4-916d-5fb3a28c7784_1_words-heart-shadow; transform-origin: 691px 1254px; }
@keyframes words-heart-drop { 
  0% { transform: translate(0px, -90px) rotate(-7deg); opacity: 0; }
  12% { opacity: 1; }
  62% { transform: translate(0px, 0px) rotate(0deg); }
  77% { transform: translate(0px, -12px) rotate(1deg); }
  90% { transform: translate(0px, 0px) rotate(0deg); }
  96% { transform: translate(0px, -2px); }
  100% { transform: translate(0px, 0px); opacity: 1; }
}
@keyframes words-heart-shadow { 
  0% { opacity: 0; transform: scale(1.25); }
  62% { opacity: 0.16; transform: scale(1); }
  77% { opacity: 0.1; transform: scale(1.06); }
  100% { opacity: 0.16; transform: scale(1); }
}
@media (prefers-reduced-motion: reduce) {
  #layer-26b9dd8d-816e-44f4-916d-5fb3a28c7784 .heart-tile, #layer-26b9dd8d-816e-44f4-916d-5fb3a28c7784 .tile-shadow { animation: auto ease 0s 1 normal none running none; }
  #layer-26b9dd8d-816e-44f4-916d-5fb3a28c7784 .tile-shadow { opacity: 0.16; }
}</style>
